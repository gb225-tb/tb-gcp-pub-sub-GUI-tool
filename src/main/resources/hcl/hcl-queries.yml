# HCL DB2 (WCS schema) source queries for the HCL -> Config Catalog build (read-only in the GUI tool).
# Token conventions (substituted by Db2ProductReader):
#   {PRODUCT_ID} -> a single product CATENTRY_ID (numeric, DB-sourced)
#   {IDS}        -> comma-separated CATENTRY_IDs (numeric, DB-sourced)
# Ids are Long values read back from DB2, so inlining them is injection-safe.
# resolveProductCatEntryIdByPartNumber uses a JDBC PreparedStatement '?' bind (user input, injection-safe).

resolveProductCatEntryIdByPartNumber: |
  SELECT CE.CATENTRY_ID
  FROM CATENTRY CE
  WHERE CE.CATENTTYPE_ID = 'ProductBean'
    AND CE.PARTNUMBER = ?
  FETCH FIRST 1 ROWS ONLY

seedProductCatEntryIds: |
  SELECT DISTINCT P.CATENTRY_ID
  FROM CATENTRY V
  INNER JOIN CATENTREL PV ON PV.CATENTRY_ID_CHILD = V.CATENTRY_ID
  INNER JOIN CATENTRY P ON P.CATENTRY_ID = PV.CATENTRY_ID_PARENT
  WHERE (V.PARTNUMBER LIKE 'TMW%' OR V.PARTNUMBER LIKE 'TUX%')
    AND PV.CATRELTYPE_ID = 'PRODUCT_VARIANT'
    AND V.CATENTTYPE_ID = 'VariantBean'
    AND P.CATENTTYPE_ID = 'ProductBean'
    AND V.FIELD1 = 1
    AND V.FIELD2 = 1

relationsByProduct: |
  SELECT P.CATENTRY_ID, P.PARTNUMBER, V.CATENTRY_ID, V.PARTNUMBER, S.CATENTRY_ID, S.PARTNUMBER,
         PD.PUBLISHED, VD.PUBLISHED, SD.PUBLISHED
  FROM CATENTRY P
  INNER JOIN CATENTDESC PD ON PD.CATENTRY_ID = P.CATENTRY_ID
  INNER JOIN CATENTREL PV ON PV.CATENTRY_ID_PARENT = P.CATENTRY_ID
  INNER JOIN CATENTRY V ON V.CATENTRY_ID = PV.CATENTRY_ID_CHILD
  INNER JOIN CATENTDESC VD ON VD.CATENTRY_ID = V.CATENTRY_ID
  INNER JOIN CATENTREL VS ON VS.CATENTRY_ID_PARENT = V.CATENTRY_ID
  INNER JOIN CATENTRY S ON S.CATENTRY_ID = VS.CATENTRY_ID_CHILD
  INNER JOIN CATENTDESC SD ON SD.CATENTRY_ID = S.CATENTRY_ID
  WHERE (V.PARTNUMBER LIKE 'TMW%' OR V.PARTNUMBER LIKE 'TUX%')
    AND PV.CATRELTYPE_ID = 'PRODUCT_VARIANT'
    AND P.CATENTTYPE_ID = 'ProductBean'
    AND V.CATENTTYPE_ID = 'VariantBean'
    AND V.FIELD1 = 1
    AND V.FIELD2 = 1
    AND P.CATENTRY_ID = {PRODUCT_ID}

detailsByIds: |
  SELECT CE.CATENTRY_ID, CE.MFNAME, CE.MFPARTNUMBER, CE.PARTNUMBER, CED.NAME, CED.THUMBNAIL, CED.FULLIMAGE,
         CED.LONGDESCRIPTION, CED.SHORTDESCRIPTION, CE.FIELD5, CED.PUBLISHED,
         CE.FIELD1, CE.FIELD2, CED.AVAILABILITYDATE,
         CE.STARTDATE, CE.ENDDATE, CE.LASTUPDATE
  FROM CATENTRY CE
  INNER JOIN CATENTDESC CED ON CED.CATENTRY_ID = CE.CATENTRY_ID
  WHERE CE.CATENTRY_ID IN ({IDS})

seoUrlsByIds: |
  SELECT CE.CATENTRY_ID, SUK.URLKEYWORD
  FROM CATENTRY CE
  LEFT OUTER JOIN SEOURL SU ON SU.TOKENVALUE = VARCHAR(CE.CATENTRY_ID)
  LEFT OUTER JOIN SEOURLKEYWORD SUK ON SUK.SEOURL_ID = SU.SEOURL_ID AND SUK.STATUS = 1
  WHERE SU.TOKENNAME = 'ProductToken'
    AND CE.CATENTTYPE_ID IN ('ProductBean','VariantBean')
    AND CE.CATENTRY_ID IN ({IDS})

associationsByIds: |
  SELECT CE.CATENTRY_ID, CE.PARTNUMBER, CE2.CATENTRY_ID, CE2.PARTNUMBER, ME.MASSOCTYPE_ID
  FROM CATENTRY CE
  INNER JOIN MASSOCCECE ME ON ME.CATENTRY_ID_FROM = CE.CATENTRY_ID
  INNER JOIN CATENTRY CE2 ON CE2.CATENTRY_ID = ME.CATENTRY_ID_TO
  WHERE CE.CATENTTYPE_ID = 'VariantBean'
    AND CE.CATENTRY_ID IN ({IDS})

pricesByIds: |
  SELECT O.CATENTRY_ID AS CATENTRY_ID, T.NAME AS PRICE_TYPE, OP.PRICE AS PRICE
  FROM OFFER O
  INNER JOIN OFFERPRICE OP ON OP.OFFER_ID = O.OFFER_ID
  INNER JOIN TRADEPOSCN T ON O.TRADEPOSCN_ID = T.TRADEPOSCN_ID
  WHERE T.TRADEPOSCN_ID IN (4000000000000000551, 4000000000000000552, 4000000000000000603)
    AND O.CATENTRY_ID IN ({IDS})

attributesByIds: |
  SELECT CEA.CATENTRY_ID, A.IDENTIFIER AS ATTRIBUTE, AV.IDENTIFIER AS VALUE, AVD.VALUE AS DESCRIPTION
  FROM CATENTRYATTR CEA
  INNER JOIN CATENTRY CE ON CE.CATENTRY_ID = CEA.CATENTRY_ID
  INNER JOIN ATTR A ON A.ATTR_ID = CEA.ATTR_ID
  INNER JOIN ATTRVAL AV ON AV.ATTRVAL_ID = CEA.ATTRVAL_ID
  INNER JOIN ATTRVALDESC AVD ON AVD.ATTRVAL_ID = AV.ATTRVAL_ID
  WHERE CE.CATENTRY_ID IN ({IDS})

# ── Category -> products (used by the Categories view; read-only) ──────────────
# The '?' binds take user input safely via PreparedStatement. resolveCatGroupById
# takes a numeric CATGROUP_ID; resolveCatGroupByIdentifier takes the CATGROUP
# IDENTIFIER string. The count/list queries take the resolved numeric CATGROUP_ID.
resolveCatGroupById: |
  SELECT CATGROUP_ID, IDENTIFIER
  FROM CATGROUP
  WHERE CATGROUP_ID = ?
  FETCH FIRST 1 ROWS ONLY

resolveCatGroupByIdentifier: |
  SELECT CATGROUP_ID, IDENTIFIER
  FROM CATGROUP
  WHERE IDENTIFIER = ?
  FETCH FIRST 1 ROWS ONLY

countProductsInCategory: |
  SELECT COUNT(DISTINCT CE.CATENTRY_ID)
  FROM CATGPENREL CGPR
  INNER JOIN CATENTRY CE ON CE.CATENTRY_ID = CGPR.CATENTRY_ID
  WHERE CGPR.CATGROUP_ID = ?
    AND CE.CATENTTYPE_ID = 'ProductBean'

listProductsInCategory: |
  SELECT CE.CATENTRY_ID, CE.PARTNUMBER, CED.NAME, CED.PUBLISHED
  FROM CATGPENREL CGPR
  INNER JOIN CATENTRY CE ON CE.CATENTRY_ID = CGPR.CATENTRY_ID
  INNER JOIN CATENTDESC CED ON CED.CATENTRY_ID = CE.CATENTRY_ID
  WHERE CGPR.CATGROUP_ID = ?
    AND CE.CATENTTYPE_ID = 'ProductBean'
  ORDER BY CE.PARTNUMBER
  FETCH FIRST 500 ROWS ONLY

# Uncapped distinct part numbers in the category (used by the cross-source reconciliation
# in the Categories view; the driver still bounds it via a Java-side row cap).
listAllProductPartNumbersInCategory: |
  SELECT DISTINCT CE.PARTNUMBER
  FROM CATGPENREL CGPR
  INNER JOIN CATENTRY CE ON CE.CATENTRY_ID = CGPR.CATENTRY_ID
  WHERE CGPR.CATGROUP_ID = ?
    AND CE.CATENTTYPE_ID = 'ProductBean'
    AND CE.PARTNUMBER IS NOT NULL
  ORDER BY CE.PARTNUMBER
