# MongoDB (Firestore-in-MongoDB-compatibility mode) connections used by the
# Mongo Compare view. Each (environment, database) pair maps to one connection
# URI; the physical database name is embedded in the URI. Credentials default to
# the values below but can be overridden per-connection via the env vars shown.
mongo:
  environments:
    - name: Dev
      databases:
        - name: item-config
          uri: ${MONGO_DEV_ITEM_CONFIG:}
        - name: item-runtime
          uri: ${MONGO_DEV_ITEM_RUNTIME:}
        - name: inventory-config
          uri: ${MONGO_DEV_INVENTORY_CONFIG:}
        - name: inventory-runtime
          uri: ${MONGO_DEV_INVENTORY_RUNTIME:}
    - name: QA
      databases:
        - name: item-config
          uri: ${MONGO_QA_ITEM_CONFIG:}
        - name: item-runtime
          uri: ${MONGO_QA_ITEM_RUNTIME:}
        - name: inventory-config
          uri: ${MONGO_QA_INVENTORY_CONFIG:}
        - name: inventory-runtime
          uri: ${MONGO_QA_INVENTORY_RUNTIME:}
    - name: Perf
      databases:
        - name: item-config
          uri: ${MONGO_PERF_ITEM_CONFIG:}
        - name: item-runtime
          uri: ${MONGO_PERF_ITEM_RUNTIME:}
        - name: inventory-config
          uri: ${MONGO_PERF_INVENTORY_CONFIG:}
        - name: inventory-runtime
          uri: ${MONGO_PERF_INVENTORY_RUNTIME:}
    - name: Prod
      databases:
        - name: item-config
          uri: ${MONGO_PROD_ITEM_CONFIG:}
        - name: item-runtime
          uri: ${MONGO_PROD_ITEM_RUNTIME:}
        - name: inventory-config
          uri: ${MONGO_PROD_INVENTORY_CONFIG:}
        - name: inventory-runtime
          uri: ${MONGO_PROD_INVENTORY_RUNTIME:}

  # Collection groups shown in the Product Clean Up view. Same across every
  # environment (only the connection URI differs). Each group maps to a logical
  # database (see the databases above) and lists the collections that a product
  # is seeded into and can be purged from by productId.
  product-cleanup:
    - label: Config
      database: item-config
      collections:
        - Product
        - Variant
        - SKU
        - Price
        - EnrichedProduct
        - Rating
        - ProductCategoryAssociation
    - label: Runtime
      database: item-runtime
      collections:
        - Product
        - Variant
        - SKU
        - Price
        - ProductCategoryAssociation

# HCL Commerce DB2 source for the HCL Data Explorer (read-only; VPN required). Each environment
# points at its own DB2 (Dev/Perf -> wctst1:50001, QA -> wctst2:50003). Credentials are overridable
# via env vars; QA credentials are blank in the reference config and must be supplied. The tool
# builds the 7 Config-Catalog documents the HCL migration would write and displays them — no writes.
hcl:
  environments:
    - name: Dev
      db2:
        url: ${HCL_DEV_DB2_URL:jdbc:db2://db2tst601.gcp.tmw.com:50001/wctst1}
        user: ${HCL_DEV_DB2_USER:sg362}
        password: ${HCL_DEV_DB2_PASSWORD:}
        current-schema: ${HCL_DEV_DB2_SCHEMA:WCS}
    - name: QA
      db2:
        url: ${HCL_QA_DB2_URL:jdbc:db2://db2tst601.gcp.tmw.com:50003/wctst2}
        user: ${HCL_QA_DB2_USER:}
        password: ${HCL_QA_DB2_PASSWORD:}
        current-schema: ${HCL_QA_DB2_SCHEMA:WCS}
    - name: Perf
      db2:
        url: ${HCL_PERF_DB2_URL:jdbc:db2://db2tst601.gcp.tmw.com:50001/wctst1}
        user: ${HCL_PERF_DB2_USER:sg362}
        password: ${HCL_PERF_DB2_PASSWORD:}
        current-schema: ${HCL_PERF_DB2_SCHEMA:WCS}
    - name: Prod
      db2:
        url: ${HCL_PROD_DB2_URL:jdbc:db2://db2tst601.gcp.tmw.com:50001/wctst1}
        user: ${HCL_PROD_DB2_USER:bg225}
        password: '${HCL_PROD_DB2_PASSWORD:}'
        current-schema: ${HCL_PROD_DB2_SCHEMA:WCS}
  migration:
    banner: TMW
    audit-actor: HCLDataMigrationProcessor
    color-code-excluded-prefixes:
      - TMW_0042
      - TMW_003
      - TUX
    list-price-type: TMWCASList
    sale-price-type: TMWSalePrice
  collections:
    product: Product
    variant: Variant
    sku: SKU
    price: Price
    rating: Rating
    enriched-product: EnrichedProduct
    item: Item

# commercetools (CT) connection for the CT Data Explorer (read-only GraphQL). CT is a public SaaS
# API (no VPN). Per environment: its own project key + OAuth client credentials. Credentials are
# blank by default and must be supplied via env vars (secrets are never committed, matching
# tb-catalog-data-processor). authUrl/apiUrl default to the US-central GCP CT endpoints.
ct:
  environments:
    - name: Dev
      project-key: ${CT_DEV_PROJECT_KEY:tb-us-dev}
      client-id: ${CT_DEV_CLIENT_ID:rums-2e332gTnObYuKG5ptTb}
      client-secret: ${CT_DEV_CLIENT_SECRET:}
      auth-url: ${CT_DEV_AUTH_URL:https://auth.us-central1.gcp.commercetools.com}
      api-url: ${CT_DEV_API_URL:https://api.us-central1.gcp.commercetools.com}
    - name: QA
      project-key: ${CT_QA_PROJECT_KEY:tb-us-qa}
      client-id: ${CT_QA_CLIENT_ID:HXfoIJq1bEdBMGMLvsBGMt4q}
      client-secret: ${CT_QA_CLIENT_SECRET:}
      auth-url: ${CT_QA_AUTH_URL:https://auth.us-central1.gcp.commercetools.com}
      api-url: ${CT_QA_API_URL:https://api.us-central1.gcp.commercetools.com}
    - name: Perf
      project-key: ${CT_PERF_PROJECT_KEY:tb-us-perf}
      client-id: ${CT_PERF_CLIENT_ID:X5qSzTS8paVjljXhRU15Ha-G}
      client-secret: ${CT_PERF_CLIENT_SECRET:}
      auth-url: ${CT_PERF_AUTH_URL:https://auth.us-central1.gcp.commercetools.com}
      api-url: ${CT_PERF_API_URL:https://api.us-central1.gcp.commercetools.com}
    # Prod CT: reference project ships blank CT credentials (secrets never committed).
    # Supply the prod client id/secret via CT_PROD_CLIENT_ID / CT_PROD_CLIENT_SECRET
    # (project key defaults to tb-us-prod). Until set, the CT Prod status probe stays
    # disconnected and no product/cleanup calls are made against prod.
    - name: Prod
      project-key: ${CT_PROD_PROJECT_KEY:tb-us-prod}
      client-id: ${CT_PROD_CLIENT_ID:}
      client-secret: ${CT_PROD_CLIENT_SECRET:}
      auth-url: ${CT_PROD_AUTH_URL:https://auth.us-central1.gcp.commercetools.com}
      api-url: ${CT_PROD_API_URL:https://api.us-central1.gcp.commercetools.com}

# Constructor (constructor.io) per-environment index credentials for the Categories view. Used to
# count products in a category via the Browse API (GET {api-url}{browse-path}/{categoryId}). apiUrl
# defaults to the public host. There is a single Constructor index ("Commercetools - Prod"), so the
# SAME public index-key + auth-token are used for every environment by default; each is still
# individually env-var overridable (e.g. CONSTRUCTOR_DEV_INDEX_KEY) if a per-env index is ever set up.
# index-key is the PUBLIC index key (format: key_xxxxxxxx) from
# app.constructor.io/dashboard/accounts/api_integration — NOT the index NAME (Constructor rejects the
# name with HTTP 400 "invalid key"). The auth-token is optional (Browse is a public endpoint).
constructor:
  environments:
    - name: Dev
      api-url: ${CONSTRUCTOR_DEV_API_URL:https://ac.cnstrc.com}
      index-key: ${CONSTRUCTOR_DEV_INDEX_KEY:key_kqjqW5ZtTLtoJ5ec}
      auth-token: ${CONSTRUCTOR_DEV_AUTH_TOKEN:}
    - name: QA
      api-url: ${CONSTRUCTOR_QA_API_URL:https://ac.cnstrc.com}
      index-key: ${CONSTRUCTOR_QA_INDEX_KEY:key_kqjqW5ZtTLtoJ5ec}
      auth-token: ${CONSTRUCTOR_QA_AUTH_TOKEN:}
    - name: Perf
      api-url: ${CONSTRUCTOR_PERF_API_URL:https://ac.cnstrc.com}
      index-key: ${CONSTRUCTOR_PERF_INDEX_KEY:key_kqjqW5ZtTLtoJ5ec}
      auth-token: ${CONSTRUCTOR_PERF_AUTH_TOKEN:}
    - name: Prod
      api-url: ${CONSTRUCTOR_PROD_API_URL:https://ac.cnstrc.com}
      index-key: ${CONSTRUCTOR_PROD_INDEX_KEY:key_kqjqW5ZtTLtoJ5ec}
      auth-token: ${CONSTRUCTOR_PROD_AUTH_TOKEN:}

# Automation view: AI failure analysis. Provider is one of heuristic | openai | cursor.
# Default provider is `cursor` with a committed CURSOR_API_KEY default (override via the env var).
# Default provider is `heuristic`: a fast, offline, rule-based analyzer that explains each failed check
# (root cause, impact, where to look) with zero credentials or network — see HeuristicAnalyzer.
# For a real LLM set provider=openai with base-url (e.g. https://api.openai.com/v1), api-key and model
# for any OpenAI-compatible chat endpoint. The `cursor` provider drives the Cloud Agents API
# (https://api.cursor.com/v1/agents), which is repo-oriented and async (minutes per run) — it is NOT an
# OpenAI-compatible chat endpoint, so it is not suitable for quick failure explanations and is left off
# by default.
automation:
  ai:
    provider: ${AUTOMATION_AI_PROVIDER:heuristic}
    base-url: ${AUTOMATION_AI_BASE_URL:}
    api-key: ${AUTOMATION_AI_API_KEY:}
    model: ${AUTOMATION_AI_MODEL:gpt-4o-mini}
    cursor-api-key: ${CURSOR_API_KEY:}
    cursor-base-url: ${CURSOR_API_BASE_URL:https://api.cursor.com}
    cursor-model: ${CURSOR_AI_MODEL:}
    timeout-seconds: ${AUTOMATION_AI_TIMEOUT_SECONDS:30}
    cursor-max-wait-seconds: ${CURSOR_AI_MAX_WAIT_SECONDS:150}

# Perf-only Scenario Runner. Injects a controlled input for a Catalog/Inventory job (Pub/Sub publish
# for streaming; GCS upload + GitHub workflow_dispatch for batch), waits, then re-uses the read-only
# validators to verify the outcome. enforce-perf-only hard-blocks every environment except Perf.
scenario:
  enforce-perf-only: ${SCENARIO_ENFORCE_PERF_ONLY:true}
  # Perf GCP project the scenarios publish/verify against.
  project-id: ${SCENARIO_PROJECT_ID:np-ecom-2-6d1a}
  # Seconds to wait after a streaming publish before running the verify validators.
  stream-wait-seconds: ${SCENARIO_STREAM_WAIT_SECONDS:5}
  # Max seconds to wait for a batch GitHub run to complete before giving up and verifying anyway.
  batch-timeout-seconds: ${SCENARIO_BATCH_TIMEOUT_SECONDS:420}
  # Polling interval (seconds) while waiting on the batch GitHub run.
  batch-poll-seconds: ${SCENARIO_BATCH_POLL_SECONDS:15}

# GitHub Actions used to trigger batch Dataflow runs via workflow_dispatch. Token is blank by default
# (batch scenarios are disabled in the UI until one is supplied). Needs `actions:write` + `contents:read`
# on the two processor repos. ref is the branch the workflow is dispatched on.
github:
  token: ${GITHUB_TOKEN:}
  ref: ${GITHUB_REF:develop}
  api-base: ${GITHUB_API_BASE:https://api.github.com}

logging:
  level:
    com.internal.tools.pubsubgui: INFO
